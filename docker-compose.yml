# Item 422: Docker isolation — API server + isolated volumes
services:
  youtubeoto:
    build: .
    container_name: youtubeoto-app
    ports:
      - "${APP_PORT:-8000}:8000"
    # .env is excluded from the image (.dockerignore) — inject keys at runtime
    env_file:
      - .env
    environment:
      SHORTS_DB_PATH: /app/data/shorts.db
      RENDER_SAFE_MODE: "false"
      ENABLE_FFMPEG_GRAPH: "true"
      ENABLE_DB_BACKUP: "${ENABLE_DB_BACKUP:-false}"
      DB_BACKUP_PASSPHRASE: "${DB_BACKUP_PASSPHRASE:-}"
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./assets:/app/assets
      - ./bgm:/app/bgm
      - ./proofs:/app/proofs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
