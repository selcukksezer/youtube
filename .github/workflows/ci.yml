name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run render monitor tests
        run: node --test tests/js/render_monitor_restore.test.cjs

  python-314-audio-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Run audioop compatibility tests
        run: python -m pytest -q tests/test_chapter28_anil_matcha.py tests/test_chapter28_saard00.py
